name: Build signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: DoseBloom-release.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DOSEBLOOM_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re

          raw = os.environ.get("KEYSTORE_BASE64", "")
          if not raw.strip():
              raise SystemExit("DOSEBLOOM_KEYSTORE_BASE64 is empty or missing")

          data = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          if not data:
              raise SystemExit("DOSEBLOOM_KEYSTORE_BASE64 contains no base64 data")
          if len(data) % 4:
              data += "=" * (4 - len(data) % 4)

          try:
              decoded = base64.b64decode(data, validate=True)
          except Exception as exc:
              raise SystemExit(f"Invalid DOSEBLOOM_KEYSTORE_BASE64: {exc}")

          keystore_path = os.path.join(os.environ["RUNNER_TEMP"], "dosebloom-release.jks")
          with open(keystore_path, "wb") as f:
              f.write(decoded)
          print("Keystore decoded successfully")
          PY

      - name: Create signing properties
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dosebloom-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.DOSEBLOOM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: dosebloom
          KEY_PASSWORD: ${{ secrets.DOSEBLOOM_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Show APK certificate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/*.apk "$APK_NAME"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoseBloom-v${{ steps.meta.outputs.version }}-signed
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          TITLE="DoseBloom $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing APK asset"
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "DoseBloom $TAG (versionCode ${{ steps.meta.outputs.code }}). Signed release APK." \
              --latest
          fi

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/dosebloom-release.jks"
