name: Apply UI fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[ui-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app UI and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/kotlin/com/dosebloom/app/MainActivity.kt')
          s=p.read_text()
          s=s.replace('import androidx.activity.ComponentActivity\n','import androidx.appcompat.app.AppCompatActivity\n')
          s=s.replace('import androidx.compose.foundation.layout.height\n','import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n')
          s=s.replace('class MainActivity : ComponentActivity() {','class MainActivity : AppCompatActivity() {')
          s=s.replace('text = { Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {','text = { Column(Modifier.fillMaxWidth().heightIn(max = 520.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(12.dp)) {')
          old='Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { OutlinedButton(onClick = { onLanguageChanged(Localization.SYSTEM) }) { Text(stringResource(R.string.system_default)) }; OutlinedButton(onClick = { onLanguageChanged(Localization.RUSSIAN) }) { Text(stringResource(R.string.russian)) }; OutlinedButton(onClick = { onLanguageChanged(Localization.ENGLISH) }) { Text(stringResource(R.string.english)) } }'
          new='Column(Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(8.dp)) { OutlinedButton(onClick = { onLanguageChanged(Localization.SYSTEM) }, modifier = Modifier.fillMaxWidth()) { Text(stringResource(R.string.system_default)) }; OutlinedButton(onClick = { onLanguageChanged(Localization.RUSSIAN) }, modifier = Modifier.fillMaxWidth()) { Text(stringResource(R.string.russian)) }; OutlinedButton(onClick = { onLanguageChanged(Localization.ENGLISH) }, modifier = Modifier.fillMaxWidth()) { Text(stringResource(R.string.english)) } }'
          s=s.replace(old,new)
          s=s.replace('Text("DoseBloom 1.4.0", style = MaterialTheme.typography.labelSmall)','Text("DoseBloom 1.4.1", style = MaterialTheme.typography.labelMedium, modifier = Modifier.fillMaxWidth().padding(top = 4.dp), textAlign = androidx.compose.ui.text.style.TextAlign.Center)')
          p.write_text(s)
          p=Path('app/build.gradle.kts'); s=p.read_text().replace('versionCode = 8','versionCode = 9').replace('versionName = "1.4.0"','versionName = "1.4.1"'); p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/dosebloom/app/MainActivity.kt app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix localization settings UI and version label [ui-fix]'
          git push
